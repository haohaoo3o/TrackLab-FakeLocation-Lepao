name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          fi
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create local configuration without a map key
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          printf 'sdk.dir=%s\nAMAP_API_KEY=\n' "${SDK_ROOT}" > local.properties

      - name: Verify source, lint, and debug build
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug
